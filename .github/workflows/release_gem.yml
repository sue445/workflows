on:
  workflow_call:
    inputs:
      repo-name:
        description: repo name (e.g. user/repo)
        type: string
        required: true

      gem-name:
        description: gem name
        type: string
        required: true

      ruby-version:
        description: ruby version (c.f. https://github.com/ruby/setup-ruby#supported-version-syntax)
        type: string
        required: false
        default: ruby

    outputs:
      tag_name:
        description: gem version tag (e.g. v1.2.3)
        value: ${{ jobs.release.outputs.tag_name }}

jobs:
  release:
    name: Publish gem to rubygems.org

    if: github.repository == inputs.repo-name
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    outputs:
      tag_name: ${{ steps.create_release.outputs.tag_name }}

    environment:
      name: rubygems.org
      url: https://rubygems.org/gems/${{ inputs.gem-name }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@95d9a5deda9de15063e7595e9719c11c38c90ae2 # v2.13.2
        with:
          egress-policy: audit

      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          bundler-cache: true
          ruby-version: ${{ inputs.ruby-version }}

      - name: Publish to RubyGems
        uses: rubygems/release-gem@7f9650160c1a4e7989fdc9855807bdbd421d8b6b # v1.4.1
        with:
          attestations: false

      - name: Create GitHub release
        id: create_release
        run: |
          tag_name="$(git describe --tags --abbrev=0)"
          echo "tag_name=${tag_name}" >> "$GITHUB_OUTPUT"

          options=()
          if ! [[ "${tag_name}" =~ ^v[0-9.]+$ ]]; then
            options+=("--prerelease")
          fi

          gh release create "${tag_name}" --verify-tag --generate-notes "${options[@]}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
